# Configurazione build Netlify per noslab-gsa-pejo (sito statico Astro).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify Functions (assistente AI /api/chat).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Deploy preview automatici sulle Pull Request (comportamento di default
# quando il site è collegato al repo; esplicitato per chiarezza).
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Header di sicurezza su tutte le risposte.
# La CSP blocca l'esecuzione di codice o il caricamento di risorse da domini esterni:
# il sito è autosufficiente, quindi tutto arriva da 'self'. Gli script e gli stili in
# linea servono ad Astro e alle animazioni, per questo sono ammessi.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Asset con hash nel nome: cache lunga e immutabile.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Immagini e video: cache di una settimana, rivalidabile.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Pagina privata dei contatti: mai in cache, nessun referrer in uscita
# (così il token non finisce nei log di altri siti).
[[headers]]
  for = "/api/contatti"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
