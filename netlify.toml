# Configurazione build Netlify per noslab-gsa-pejo (sito statico Astro).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify Functions (assistente AI /api/chat).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Deploy preview automatici sulle Pull Request (comportamento di default
# quando il site è collegato al repo; esplicitato per chiarezza).
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Header di sicurezza su tutte le risposte.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Asset con hash nel nome: cache lunga e immutabile.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
